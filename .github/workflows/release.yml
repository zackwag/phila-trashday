name: Build and Push to Docker Hub

on:
    release:
        types: [published]
    # Builds a release by hand: for a release whose run failed, or one that
    # was published without triggering this workflow.
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to build, such as v0.1.0
                required: true

env:
    IMAGE_NAME: zackwag/phila-trashday
    TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.TAG }}

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ env.TAG }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
                      type=semver,pattern={{major}},value=${{ env.TAG }}
                      type=raw,value=latest

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  build-args: VERSION=${{ steps.meta.outputs.version }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
